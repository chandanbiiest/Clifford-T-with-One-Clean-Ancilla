[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lafs-mct-reproducibility"
version = "1.0.0"
description = "Reproducibility utilities for latency- and fidelity-aware one-clean-ancilla multi-controlled Toffoli synthesis."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
