name: Local reproducibility checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-core.txt
      - run: python scripts/01_reproduce_analytical.py
      - run: python scripts/02_verify_measurement_release.py
      - run: pytest -q
